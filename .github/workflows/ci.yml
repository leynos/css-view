name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  commit-gates:
    name: Commit gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Format
        run: |
          bun run fmt
          git diff --exit-code

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Markdown lint
        run: bunx markdownlint-cli2 README.md docs/**/*.md

      - name: Test
        run: bun run test

      - name: Audit dependencies
        run: bun audit
